name: gate
# Browser Swarm is gated like every cell: tests, a mutation witness that must be CLEAN on every gated file with the
# counts committed in data/gates.json, the vendored estate code byte for byte its home repositories' files, every
# published run re-decided from its recorded replies, and its own birth check through the estate genome action.
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tests (including seal 2, seal 3 and the page build)
        run: node --test test/*.test.mjs
      - name: mutation gate, every gated file CLEAN, counts as committed
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness
          node scripts/gates.mjs --witness .witness/witness.mjs --check
      - name: vendored files are their home repositories' files at the recorded commits
        run: |
          node -e '
          const p = require("./vendor/PROVENANCE.json"); const fs = require("fs"); const { createHash } = require("crypto");
          (async () => { let bad = 0;
            for (const v of p.files) {
              const r = await fetch(`https://raw.githubusercontent.com/${v.repo}/${v.commit}/${v.path}`);
              const theirs = createHash("sha256").update(Buffer.from(await r.arrayBuffer())).digest("hex");
              const ours = createHash("sha256").update(fs.readFileSync(v.file)).digest("hex");
              console.log((theirs === ours ? "same " : "DIFFERS ") + v.file + " = " + v.repo + "@" + v.commit.slice(0, 7) + ":" + v.path);
              if (theirs !== ours) bad++;
            }
            process.exit(bad ? 1 : 0); })();'
      - name: every published run re-decided from its recorded replies, identically
        run: |
          for f in $(node -e 'const p=require("./data/published.json");for(const k of ["tab","big","node1b"])if(p[k])console.log(p[k])'); do node scripts/replay.mjs "$f" --check; done
      - name: every published run of the fix is complete, under both seals, and re-decided identically
        run: node scripts/publish-fix.mjs --check
      - name: the follow-up build's records, composed again from the registered runs, identical to the published files
        run: node scripts/compose-followup.mjs --check
  genome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: sjgant80-hub/estate-genome@v1
